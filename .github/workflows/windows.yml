# Windows build (MSYS2 / MinGW-w64 UCRT64): builds, runs the tests and keeps a portable zip as a workflow artifact.
# There is no Windows machine on the dev side, so this workflow is where the Windows port is built and checked.
# Runs for pull requests and by hand (Actions > Windows > Run workflow). It creates no release.
name: Windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe: the version shown in the app comes from the tags

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gdb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAKE_PORTABLE=ON -DAKE_WIN_CONSOLE=ON   # TEMPORARY: see the messages of the app

      - name: Build
        run: cmake --build build

      - name: Tests
        continue-on-error: true      # first runs: find out what the Unix-minded tests still assume; remove when green
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: tst_transcript_ui (temporary)
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd build/tests
          export QT_QPA_PLATFORM=offscreen
          timeout 120 ./tst_transcript_ui.exe -v2 > /tmp/t.txt 2>&1; echo "exit=$?"
          grep -n "FAIL\|Loc:\|Actual\|Expected\|Totals\|QFATAL\|crash" /tmp/t.txt | head -30
          echo "--- tail"; tail -15 /tmp/t.txt
          echo "--- gdb"; timeout 200 gdb -batch -ex run -ex bt -ex "info threads" --args ./tst_transcript_ui.exe -v2 2>&1 | tail -45
          true

      - name: Portable zip
        run: packaging/windows/make-zip.sh build dist

      - name: Smoke test of the unpacked zip
        run: packaging/windows/smoke-test.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
